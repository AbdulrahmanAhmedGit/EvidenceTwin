# Explicit disposable test service only. Never mounts the current application data.
services:
  execution-postgres:
    image: postgres:18.6
    profiles: [execution-test]
    command: [postgres, -c, et_execution.test_cluster=enabled]
    environment:
      POSTGRES_USER: et_test_admin
      POSTGRES_PASSWORD: ${ET_EXECUTION_TEST_PASSWORD:?Generate a per-run test password}
      POSTGRES_DB: postgres
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U et_test_admin -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
